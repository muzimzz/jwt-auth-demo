spring:
  application:
    name: auth-demo
  security:
    oauth2:
      client:
        # client-secret이 그대로 들어가면 git push reject됨: 원래는 환경변수로 치환 필요
        registration:
          kakao:
            client-id: 1cfea2e7d45ecaf9be374cb0b78a40b1 # REST API key
            client-secret: mqelwi2XBpofFz5T51U7aRUuRzUj8SIV
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope: openid, profile_nickname, profile_image, friends

          naver:
            client-name: muzi-jwt-demo              # [선택] 서비스 이름 (로그인 창 띄울 때 식별용)
            client-id: L2mbZIxSFse73rysaEK4     # [★필수] 네이버 개발자 센터에서 발급받은 ID
            client-secret: wlDcKU_p3S   # [★필수] 네이버 개발자 센터에서 발급받은 비밀키
            redirect-uri: http://localhost:8080/login/oauth2/code/naver # [★필수] 인가 코드를 받을 내 서버 주소
            authorization-grant-type: authorization_code # [★필수] OAuth2 인증 방식 (항상 이 값 고정)
            # 네이버는 표준 OIDC(id_token)를 지원하지 않는 순수 OAuth2 provider라 openid 스코프를 쓰면 안 됨.
            # (openid가 있으면 Spring Security가 OIDC 플로우로 처리하려다 id_token이 없어서 로그인 실패함)
            # 아래 name,email은 네이버 개발자센터 > 제공 정보 설정에서 활성화한 항목과 맞춰야 함.
            scope: name,email

          google:
            # ⭐ 구글은 provider 설정을 아예 안 적어도 이것만으로 OIDC가 완벽히 작동합니다!
            client-id: 424369046249-b9f05jn56kdal62plkjhqmh59np77209.apps.googleusercontent.com
            client-secret: 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
            scope: openid, profile, email

        provider:
          kakao:
            issuer-uri: https://kauth.kakao.com
            # user-info-uri: https://kapi.kakao.com/v2/user/me
            user-info-uri: https://kapi.kakao.com/v1/oidc/userinfo   # 카카오 OIDC 전용 엔드포인트 (sub 포함)
            user-name-attribute: sub

          naver:
            # 네이버는 OIDC discovery/JWKS를 지원하지 않으므로 issuer-uri, jwk-set-uri는 사용 불가
            authorization-uri: https://nid.naver.com/oauth2.0/authorize # 네이버 로그인 화면 주소
            token-uri: https://nid.naver.com/oauth2.0/token             # 인가 코드를 토큰으로 바꿀 주소
            user-info-uri: https://openapi.naver.com/v1/nid/me          # 사용자 정보 조회 주소
            # 네이버 응답이 { response: { id, email, name } } 형태로 감싸져 있어서
            # 이 값만으로는 자동 매핑 안 됨 -> CustomOAuth2UserService에서 response를 풀어줘야 함
            user-name-attribute: response

  # 1. 데이터베이스 연결 설정 (DataSource)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/jwt_demo?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: root

  # 2. JPA & 하이버네이트 설정
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        # 실행되는 SQL을 콘솔창에 예쁘게 포맷팅해서 보여줍니다.
        show_sql: true
        format_sql: true
        # SQL에 들어가는 파라미터 값이 무엇인지 보여줍니다.
        use_sql_comments: true

jwt:
  secret: openssl rand -base64 32로 발급한 환경변수 필요함
  access-token-validity-ms: 60000     # 1분
  refresh-token-validity-ms: 300000   # 5분

# 로그 레벨 설정 (SQL 파라미터 바인딩 값 출력용 필수 세트)
logging:
  level:
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.security: DEBUG   # OAuth2 로그인 실패 에러 코드를 보기 위한 설정 추가
